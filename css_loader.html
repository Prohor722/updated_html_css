<style>
.loader {
    width: 60px;
    height: 60px;
    border: 6px solid #333;
    border-top-color: cyan;
    border-radius: 50%;
    animation: loader 1s linear infinite; /* loader is just a name of the animation, you can use any name you want ex:spin */
}

@keyframes loader {
    to {
        transform: rotate(360deg);
    }
}

</style>

<div class="loader"></div>
