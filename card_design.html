
<style>
    .product-image-div {
        position: relative;
        width: 300px;
        height: 200px;
        overflow: hidden;
    }
    .card-image{
        width: 100%;
        height: 200px;
        object-fit: cover;
    }
    .card-image:hover {
        transform: scale(1.25);
        transition: transform 1s ease;
        overflow: hidden;
    }

    .product-card {
        width: 300px;
        border: 1px solid #ddd;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .product-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 12px rgba(0, 0, 0, 0.2);
    }
    .product-image {
        position: absolute;
        width: 250px;
        height: 120px;
        overflow: hidden;
    }
    .product-image img {
        object-fit: cover;
    }
    .product-badges {
        position: absolute;
        top: 10px;
        left: 10px;
        display: flex;
        gap: 5px;
        z-index: 100;
    }
    .sell-badge, .new-badge {
        background-color: #ff4757;
        color: #fff;
        padding: 5px 10px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: bold;
    }
    .new-badge {
        background-color: #2ed573;
    }
    .wishlist-button {
        position: absolute;
        top: 10px;
        right: 10px;
        background: none;
        border: none;
        cursor: pointer;
        color: #ff4757;
    }
    .wishlist-button:hover {
        color: #ff6b81;
    }
    .product-details {
        padding: 15px;
    }
    .product-title {
        font-size: 18px;
        margin: 0 0 10px;
    }
    .product-description {
        font-size: 14px;
        color: #666;
        margin: 0 0 15px;
    }
    .product-price {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 15px;
    }
    .original-price {
        text-decoration: line-through;
        color: #999;
    }
    .discounted-price {
        color: #ff4757;
        font-weight: bold;
    }
    .add-to-cart-button {
        width: 100%;
        padding: 10px;
        background-color: #2e3135;
        color: #cecccc;
        font-weight: 600;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        transition: background-color 0.3s ease;
    }
    .add-to-cart-button:hover {
        background-color: #1e2022;
        color: #ffffff;
        animation: shine 1s linear infinite;
    }

    @keyframes shine {
        25% {
            background-color: #1e2022;
        }
        50% {
            background-color: #34373b;
        }
        75% {
            background-color: #484a4c;
        }
        80% {
            background-color: #2e3135;
        }
        100% {
            background-color: #2e3135;
        }
    }

</style>
<article class="product-card">
    <div class="product-image">
        <div class="product-badges">
            <span class="sell-badge">20%</span>
            <span class="new-badge">NEW</span>

            <button class="wishlist-button" aria-label="Add to Wishlist">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-heart">
                    <path d="M20.8 4.6c-1.5-1.5-3.9-1.5-5.4 0L12 8l-3.4-3.4c-1.5-1.5-3.9-1.5-5.4 0s-1.5 3.9 0 5.4L12 21l8.8-8.8c1.5-1.5 1.5-3.9 0-5.4z"></path>
                </svg>
            </button>
        </div>
    </div>

    <div class="product-image-div">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQKk6OpH40RhI-V4z_VuEWApMkHh6Al7fUWYRSUrvkW5bn6cxInTAe_yEAa&s=10" alt="Card Design" class="card-image">
    </div>

    <div class="product-details">
        <h2 class="product-title">Card Design</h2>
        <p class="product-description">A sleek and modern card design for your website or application.</p>
        <div class="product-price">
            <span class="original-price">$50.00</span>
            <span class="discounted-price">$40.00</span>
        </div>
        <button class="add-to-cart-button">Add to Cart</button>
    </div>
</article>
